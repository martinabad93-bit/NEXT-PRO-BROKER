<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Confirmado | NEXT PRO BROKER</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06090E;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a233A 0%, #06090E 100%);
            --glass-bg: rgba(18, 24, 38, 0.55);
            --glass-border: rgba(255, 255, 255, 0.09);
            --primary: #FF2A4B;
            --success: #00E699;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); 
            height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .ambient-blob {
            position: fixed; width: 600px; height: 600px; background: var(--success);
            border-radius: 50%; filter: blur(150px); opacity: 0.15; z-index: -1;
        }

        .success-card {
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 50px 40px;
            text-align: center; max-width: 500px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .icon-wrapper {
            width: 80px; height: 80px; background: rgba(0, 230, 153, 0.1); border: 2px solid var(--success);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 25px; color: var(--success); font-size: 2.5rem;
        }

        h1 { font-size: 2rem; font-weight: 900; margin-bottom: 15px; }
        p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; line-height: 1.5; }

        .btn-wa {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: #fff;
            padding: 18px; border-radius: 14px; text-decoration: none; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.3s ease;
        }
        .btn-wa:hover { transform: translateY(-3px); }

    </style>
</head>
<body>

    <div class="ambient-blob"></div>

    <div class="success-card">
        <div class="icon-wrapper">
            <i class='bx bx-check'></i>
        </div>
        <h1>Reserva Confirmada</h1>
        <p>Hemos recibido tu depósito de búsqueda exitosamente. Tu proceso de importación y asesoría ha comenzado oficialmente.</p>
        
        <a href="https://wa.me/18099824302?text=Hola,%20acabo%20de%20completar%20el%20pago%20de%20reserva%20en%20la%20web.%20Estoy%20listo%20para%20los%20siguientes%20pasos." class="btn-wa">
            <i class='bx bxl-whatsapp' style="font-size: 1.5rem;"></i>
            Iniciar Búsqueda en WhatsApp
        </a>
    </div>

</body>
</html>
